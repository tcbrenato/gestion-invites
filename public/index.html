<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestion des Invités — Accueil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.4.4/qrcode.min.js"></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --ink:       #111827;
            --ink-muted: #6b7280;
            --ink-faint: #9ca3af;
            --surface:   #ffffff;
            --surface-2: #f9fafb;
            --surface-3: #f3f4f6;
            --border:    #e5e7eb;
            --border-strong: #d1d5db;
            --accent:    #1d4ed8;
            --accent-hover: #1e40af;
            --accent-light: #eff6ff;
            --success:   #16a34a;
            --success-light: #f0fdf4;
            --success-border: #bbf7d0;
            --warning:   #d97706;
            --warning-light: #fffbeb;
            --danger:    #dc2626;
            --danger-light: #fef2f2;
            --arrived-bg: #f0fdf4;
            --radius-sm: 6px;
            --radius:    10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
            --shadow:    0 4px 12px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.05);
            --shadow-lg: 0 16px 48px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.08);
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #eef0f5;
            min-height: 100vh;
            padding: 20px;
            color: var(--ink);
            font-size: 14px;
        }

        /* ── Layout ───────────────────────────────── */
        .app {
            max-width: 1280px;
            margin: 0 auto;
        }

        .header {
            background: var(--ink);
            color: white;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 28px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,.1);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.6em;
            font-weight: 400;
            letter-spacing: -.01em;
        }

        .header-sub {
            font-size: .8em;
            opacity: .55;
            margin-top: 2px;
            font-weight: 300;
        }

        .sync-pill {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: .78em;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.15);
            color: rgba(255,255,255,.8);
            white-space: nowrap;
            transition: all .3s;
        }

        .sync-pill.syncing {
            background: rgba(217,119,6,.2);
            border-color: rgba(217,119,6,.4);
            color: #fbbf24;
        }

        .sync-pill svg { flex-shrink: 0; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            background: var(--surface);
            border-radius: 0 0 var(--radius-lg) var(--radius-lg);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
        }

        /* ── Main panel ───────────────────────────── */
        .main-panel {
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        /* ── Tabs ─────────────────────────────────── */
        .tabs-bar {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: var(--surface-2);
            padding: 0 24px;
        }

        .tab {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 14px 4px;
            margin-right: 28px;
            font-size: .84em;
            font-weight: 500;
            color: var(--ink-muted);
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all .2s;
            white-space: nowrap;
        }

        .tab:hover { color: var(--ink); }

        .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .tab-content { display: none; padding: 24px; }
        .tab-content.active { display: block; }

        /* ── Search & filters ─────────────────────── */
        .search-row {
            display: flex;
            gap: 10px;
            margin-bottom: 14px;
        }

        .input-wrap {
            flex: 1;
            position: relative;
        }

        .input-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ink-faint);
            pointer-events: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 10px 12px 10px 36px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: .9em;
            color: var(--ink);
            background: var(--surface);
            transition: border-color .2s, box-shadow .2s;
        }

        .input-wrap input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,78,216,.1);
        }

        .input-wrap input::placeholder { color: var(--ink-faint); }

        .filter-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-chip {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            border-radius: 20px;
            font-size: .8em;
            font-weight: 500;
            color: var(--ink-muted);
            cursor: pointer;
            transition: all .2s;
        }

        .filter-chip:hover { border-color: var(--accent); color: var(--accent); }

        .filter-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* ── Guest list ───────────────────────────── */
        .guests-list {
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            max-height: 560px;
            overflow-y: auto;
        }

        .guests-list::-webkit-scrollbar { width: 5px; }
        .guests-list::-webkit-scrollbar-track { background: transparent; }
        .guests-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; }

        .guest-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            align-items: center;
            gap: 12px;
            padding: 13px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            transition: background .15s;
        }

        .guest-item:last-child { border-bottom: none; }

        .guest-item:hover { background: var(--surface-2); }

        .guest-item.arrived { background: var(--arrived-bg); }
        .guest-item.arrived:hover { background: #e8fdf1; }

        .guest-info {
            cursor: pointer;
            min-width: 0;
        }

        .guest-name {
            font-weight: 500;
            font-size: .9em;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .guest-meta {
            font-size: .78em;
            color: var(--ink-faint);
            margin-top: 2px;
        }

        .table-badge {
            background: var(--surface-3);
            color: var(--ink-muted);
            border: 1px solid var(--border);
            padding: 4px 10px;
            border-radius: var(--radius-sm);
            font-size: .75em;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Custom checkbox */
        .check-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .check-wrap input[type="checkbox"] {
            appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-strong);
            border-radius: 5px;
            background: var(--surface);
            cursor: pointer;
            transition: all .2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            flex-shrink: 0;
        }

        .check-wrap input[type="checkbox"]:checked {
            background: var(--success);
            border-color: var(--success);
        }

        .check-wrap input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            width: 5px;
            height: 9px;
            border-right: 2px solid white;
            border-bottom: 2px solid white;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        /* ── Table view grid ──────────────────────── */
        .table-view-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 14px;
            margin-top: 20px;
        }

        .table-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow .2s;
        }

        .table-card:hover { box-shadow: var(--shadow); }

        .table-card-header {
            padding: 12px 16px;
            background: var(--ink);
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-card-header h5 {
            font-size: .85em;
            font-weight: 600;
            letter-spacing: .03em;
            text-transform: uppercase;
        }

        .table-card-count {
            font-size: .75em;
            opacity: .65;
        }

        .table-card-body {
            padding: 12px 16px;
        }

        .table-card-progress {
            height: 3px;
            background: var(--surface-3);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .table-card-progress-fill {
            height: 100%;
            background: var(--success);
            border-radius: 10px;
            transition: width .4s ease;
        }

        .guest-row-small {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
            font-size: .8em;
            color: var(--ink-muted);
        }

        .guest-row-small .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--border-strong);
            flex-shrink: 0;
        }

        .guest-row-small.is-arrived { color: var(--ink); }
        .guest-row-small.is-arrived .dot { background: var(--success); }

        /* ── Reports ──────────────────────────────── */
        .reports-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .report-kpi {
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
        }

        .report-kpi .kpi-val {
            font-family: 'DM Serif Display', serif;
            font-size: 2em;
            color: var(--ink);
            line-height: 1;
        }

        .report-kpi .kpi-label {
            font-size: .78em;
            color: var(--ink-muted);
            margin-top: 4px;
        }

        .reports-table {
            width: 100%;
            border-collapse: collapse;
            font-size: .85em;
        }

        .reports-table thead tr {
            background: var(--ink);
            color: white;
        }

        .reports-table th, .reports-table td {
            padding: 10px 14px;
            text-align: left;
        }

        .reports-table th { font-weight: 500; font-size: .8em; letter-spacing: .04em; text-transform: uppercase; }

        .reports-table tbody tr { border-bottom: 1px solid var(--border); }
        .reports-table tbody tr:hover { background: var(--surface-2); }

        .progress-bar {
            width: 80px;
            height: 5px;
            background: var(--surface-3);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--success);
            border-radius: 10px;
        }

        /* ── Sidebar ──────────────────────────────── */
        .sidebar {
            background: var(--surface-2);
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .sidebar-section {
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-label {
            font-size: .7em;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--ink-faint);
            margin-bottom: 12px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .stat-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 14px 12px;
            text-align: center;
        }

        .stat-box .val {
            font-family: 'DM Serif Display', serif;
            font-size: 1.9em;
            line-height: 1;
            color: var(--ink);
        }

        .stat-box .lbl {
            font-size: .72em;
            color: var(--ink-faint);
            margin-top: 3px;
        }

        .stat-box.success .val { color: var(--success); }
        .stat-box.warning .val { color: var(--warning); }
        .stat-box.accent  .val { color: var(--accent); }

        /* QR section */
        .qr-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .qr-placeholder {
            color: var(--ink-faint);
            font-size: .8em;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .qr-guest-name {
            font-weight: 600;
            font-size: .85em;
            color: var(--ink);
        }

        .qr-table-name {
            font-size: .75em;
            color: var(--ink-muted);
        }

        /* ── Buttons ──────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 9px 16px;
            border: none;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: .85em;
            font-weight: 500;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
            line-height: 1;
        }

        .btn svg { flex-shrink: 0; }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            box-shadow: 0 4px 12px rgba(29,78,216,.25);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--border-strong);
        }

        .btn-secondary:hover {
            background: var(--surface-3);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #15803d;
            transform: translateY(-1px);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-full { width: 100%; justify-content: center; }

        /* action buttons row */
        .action-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        /* ── Toast ────────────────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--ink);
            color: white;
            padding: 12px 18px;
            border-radius: var(--radius);
            font-size: .85em;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(80px);
            opacity: 0;
            transition: all .3s cubic-bezier(.34,1.56,.64,1);
            z-index: 2000;
            pointer-events: none;
            max-width: 340px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast-success { background: var(--success); }

        /* ── Modal ────────────────────────────────── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.45);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.open { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 460px;
            box-shadow: var(--shadow-lg);
            animation: modal-in .25s ease;
        }

        @keyframes modal-in {
            from { opacity: 0; transform: scale(.96) translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.2em;
            font-weight: 400;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink-muted);
            transition: all .2s;
        }

        .modal-close:hover { background: var(--surface-3); color: var(--ink); }

        .modal-body { padding: 24px; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            font-size: .82em;
            font-weight: 500;
            color: var(--ink-muted);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: .9em;
            color: var(--ink);
            background: var(--surface);
            transition: border-color .2s, box-shadow .2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(29,78,216,.1);
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        /* ── Responsive ───────────────────────────── */
        @media (max-width: 860px) {
            .main-grid { grid-template-columns: 1fr; }
            .sidebar { border-top: 1px solid var(--border); }
            .reports-summary { grid-template-columns: 1fr 1fr 1fr; }
        }

        @media (max-width: 560px) {
            body { padding: 10px; }
            .header { padding: 18px; flex-wrap: wrap; }
            .reports-summary { grid-template-columns: 1fr 1fr; }
        }

        @media print {
            body { background: white; padding: 0; }
            .app { max-width: none; }
            .header { border-radius: 0; }
            .main-grid { box-shadow: none; border-radius: 0; }
            .sidebar, .tabs-bar, .search-row, .filter-row, .action-row, .modal-overlay, .toast { display: none !important; }
            .tab-content { display: block !important; }
        }

        /* --- CONFIGURATION RESPONSIVE --- */

        /* 1. Meta tag pour mobile (à vérifier dans ton <head>) */
        /* Assure-toi d'avoir <meta name="viewport" content="width=device-width, initial-scale=1.0"> */

        @media (max-width: 768px) {
            /* La grille principale passe sur une seule colonne */
            .container, .app-container {
                display: flex !important;
                flex-direction: column !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 5px !important;
            }

            /* On cache la sidebar ou on la met en bas */
            aside, .sidebar {
                width: 100% !important;
                order: 2; /* Passe après la liste */
                margin-top: 20px;
            }

            /* La liste des invités prend toute la place */
            main, .main-content {
                width: 100% !important;
                order: 1;
            }

            /* On ajuste les lignes d'invités pour que ça ne dépasse pas */
            .guest-row {
                grid-template-columns: 1fr auto 40px !important; /* On réduit les colonnes */
                padding: 15px 10px !important;
                gap: 10px;
            }

            /* On réduit la taille du texte pour mobile */
            .guest-name {
                font-size: 0.95em !important;
                word-break: break-word; /* Évite que les noms longs cassent tout */
            }

            .table-badge {
                padding: 5px 8px !important;
                font-size: 0.85em !important;
            }

            /* On rend les boutons de filtre défilables horizontalement */
            .filter-bar {
                overflow-x: auto;
                white-space: nowrap;
                padding: 10px;
                -webkit-overflow-scrolling: touch;
            }

            .btn-filter {
                padding: 8px 15px !important;
                font-size: 12px !important;
            }
        }

        /* Force la liste de recherche à rester responsive */
        #guestContainer, .results-container, #guestList {
            width: 100% !important;
            max-width: 100vw !important;
            display: block !important;
            padding: 0 !important;
            overflow-x: hidden !important;
        }

        /* Force chaque ligne d'invité trouvée à s'ajuster */
        .guest-row, .item-invite {
            display: flex !important;
            flex-wrap: wrap !important; /* Permet au texte de passer à la ligne si trop long */
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 15px 10px !important;
        }

        /* Ajuste le texte dans les résultats */
        .guest-name, .guest-info {
            flex: 1 !important;
            min-width: 0 !important; /* Empêche le texte de pousser la largeur */
            overflow-wrap: break-word !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app">
    <!-- HEADER -->
    <div class="header">
        <div class="header-brand">
            <div class="header-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

<script>
    // 1. Initialisation immédiate
    const supabaseUrl = 'https://mzzerkdpmwsonaouqrvu.supabase.co';
    const supabaseKey = 'sb_publishable_DSC5hm8vVAHT9QWwFLVkPw_9YXzKkwl';
    
    // On crée l'objet supabase globalement
    window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

    console.log("Tentative de connexion Supabase...");

    // 2. Ta fonction pour charger les invités
    let realtimeChannel = null;
    async function loadGuests() {
        try {
            const { data, error } = await window.supabase
                .from('invites')
                .select('*')
                .order('nom');

            if (error) throw error;
            
            console.log("Données reçues :", data);
            if (typeof renderGuests === "function") renderGuests(data);
            
            // Setup realtime listener (une seule fois)
            if (!realtimeChannel) {
                console.log("Configuration du listener temps réel...");
                realtimeChannel = window.supabase
                    .channel('public:invites')
                    .on('postgres_changes', 
                        { event: 'UPDATE', schema: 'public', table: 'invites' },
                        (payload) => {
                            console.log("Modification détectée:", payload);
                            loadGuests();
                        }
                    )
                    .on('postgres_changes',
                        { event: 'INSERT', schema: 'public', table: 'invites' },
                        (payload) => {
                            console.log("Nouvel invité ajouté:", payload);
                            loadGuests();
                        }
                    )
                    .subscribe();
            }
            
        } catch (err) {
            console.error("Erreur de chargement :", err.message);
        }
    }

    // Lancer au chargement de la page
    document.addEventListener('DOMContentLoaded', loadGuests);

    // ── Data ──────────────────────────────────────────────
    let guestData = {
        tables: {
            "01": { label: "Table 01", guests: [] },
            "02": { label: "Table 02", guests: [] },
            "03": { label: "Table 03", guests: [] },
            "04": { label: "Table 04", guests: [] },

            "06": { label: "Table 06", guests: [] },

            "13": { label: "Table 13", guests: [] },
            "14": { label: "Table 14", guests: [] },
            "15": { label: "Table 15", guests: [] },
            "16": { label: "Table 16", guests: [] }
        }
    };

    let currentFilter = 'all';
    let selectedGuest = null;

    let initialGuestsList = {
        "01": ["M. Rock d'Almeida","Natacha d'Almeida","Calixta d'Almeida","Stan d'Almeida","M. et Mme Max d'Almeida","Mme Euphrasie","Mme Tassi Bertho","M. Charles"],
        "02": ["Dédé Rosemonde","Maître Daniel d'Almeida","Charly d'Almeida","Viviano","Hermine","Lynos"],
        "03": ["Pedro","Ives","Edwige","Fo Koffi","Irène","Chico","Vincent","Patricia"],
        "04": ["Amir / Ayélé","Charbo / Mathis","Christina / Dani","Dotou / Stella","Leslie","Esther","Hans","Irina"],
        "05": ["MR et Mme Zinsou","MR et Mme Cyro","Daris","Cynelle","Polycarpe","Maître Fransisca","MR Kola OKOUDJOU"],
        "06": ["MR Gabin Cakpo","MR et Mme Edon","Delonix","MR Tiburce Montcho","MR Richard","MR Kader","Lydie"],
        "07": ["MR et Mme Hounkpatin","MR Francis Chahaunka","Josiane Chahaunka","Nicole Chahaunka","Elvine Chahaunka","Carole Gandonou","Hélène Saley","Nadine","Elvire Hervé"],
        "08": ["Famille Gonçalves","Mme d'Almeida Agathe","Mme Mehinto Josiane","MR Charles Benon","Mme Nadine Ahounou","Mme Yolande Houngué","Mme Adjibi"],
        "09": ["Mme Georgia","Mme AMOZonahoun","Mme et MR Aplogan JP","Mme et MR Faraj","Tante Mir","Rony"],
        "10": ["Mme et MR d'Almeida Georges","MR et Mme Marie Constance","Spero d'Almeida","Mme Valerie d'Almeida","MR Sosthène d'Almeida","MR et Mme Houeto Lydie"],
        "11": ["Sagbohan","Nel","Zeinab","Richard Flash","Nikanor","Pépé Oléka","Petit Miguelito"],
        "12": ["Mme Fransisca d'Almeida","Mme Guedegbé","FO Clément","MR et Mme Dagnon","Mme et MR Houngué Viviane","Mme Abalo"],
        "13": ["Mme Sath","Mme Lisette Gansou","Mme Olga","Mme Joslyne","Mme Sylvie Gansou","Mme Georgette","MR Mme POSSOU","MR Rodolphe","MR Gérard"],
        "14": ["Mme Afoussath","Mme Rachelle AMAKOU","MR Prospère","MR Atohoun","Mme Mathilde","Mme Nadia Gansou","Mme Prisca Ahouandjinou","MR Frederik","Mme Christelle"],
        "15": ["Poupette Binazon","Eric Adanho","Stephan Johson","Jeanette Kohoke","Magloire Likiti","Eli Likiti","Allegra","Ella Adanho","Estelle Adanho"],
        "16": ["Mme Tchanhoun Valérie","Mme Parfaite Sossouhounto","FOFO Ayi","MR Christian Amasse","Mme Aurore Talon","MR Aurélien SAH","Carine"]
    };

    // ── Render guests from Supabase data ─────────────────
    function renderGuests(supabaseData) {
        if (!supabaseData || !Array.isArray(supabaseData)) {
            console.warn("renderGuests: Données invalides ou vides");
            return;
        }

        console.log(`renderGuests: Traitement de ${supabaseData.length} invités`);

        // Réinitialiser les tables
        Object.keys(guestData.tables).forEach(t => {
            guestData.tables[t].guests = [];
        });

        // Mapper les données Supabase vers guestData
        supabaseData.forEach(row => {
            const tableNum = String(row.table || "01").padStart(2, "0");
            if (guestData.tables[tableNum]) {
                guestData.tables[tableNum].guests.push({
                    id: row.id,
                    name: row.nom,
                    arrived: row.est_present === true,
                    timestamp: row.timestamp
                });
            }
        });

        // Fallback: si aucune donnée, utiliser initialGuestsList
        if (!Object.values(guestData.tables).some(t => t.guests.length)) {
            console.log("renderGuests: Aucune donnée Supabase, utilisation fallback local");
            Object.keys(initialGuestsList).forEach(t => {
                guestData.tables[t].guests = initialGuestsList[t].map(name => ({
                    id: Math.random().toString(36).substr(2, 9),
                    name, arrived: false, timestamp: null
                }));
            });
        }

        // Sauvegarder en localStorage
        localStorage.setItem('guestData', JSON.stringify(guestData));

        // Mettre à jour l'affichage
        renderGuestsList();
        updateStats();
        renderTableView();
        renderReports();
    }

    // ── Init ──────────────────────────────────────────────
    window.onload = async function() {
        const saved = localStorage.getItem('guestData');
        if (saved) {
            guestData = JSON.parse(saved);
        }

        const sel = document.getElementById('guestTable');
        Object.keys(guestData.tables).forEach(t => {
            const o = document.createElement('option');
            o.value = t;
            o.text = guestData.tables[t].label;
            sel.appendChild(o);
        });

        renderGuestsList();
        updateStats();
        renderTableView();
        renderReports();
    };

    // ── Tab switching ─────────────────────────────────────
    function switchTab(name, el) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(name).classList.add('active');
        el.classList.add('active');
        if (name === 'tables') renderTableView();
        if (name === 'reports') renderReports();
    }

    // ── Render guests list ────────────────────────────────
    function renderGuestsList() {
        const list = document.getElementById('guestsList');
        list.innerHTML = '';
        const search = document.getElementById('searchInput').value.toLowerCase().trim();

        let items = [];
        Object.keys(guestData.tables).forEach(t => {
            guestData.tables[t].guests.forEach(g => {
                if (currentFilter === 'arrived' && !g.arrived) return;
                if (currentFilter === 'pending' && g.arrived) return;
                if (search && !g.name.toLowerCase().includes(search)) return;
                items.push({ ...g, table: t });
            });
        });

        if (!items.length) {
            list.innerHTML = `<div style="padding:32px;text-align:center;color:var(--ink-faint);font-size:.85em;">
                <svg style="display:block;margin:0 auto 10px" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                Aucun résultat
            </div>`;
            return;
        }

        items.forEach(g => {
            const el = document.createElement('div');
            el.className = 'guest-item' + (g.arrived ? ' arrived' : '');
            el.innerHTML = `
                <div class="guest-info" onclick="selectGuest('${g.id}','${g.table}')">
                    <div class="guest-name">${escHtml(g.name)}</div>
                    <div class="guest-meta">Table ${g.table}${g.timestamp ? ' · ' + new Date(g.timestamp).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) : ''}</div>
                </div>
                <div class="table-badge">T${g.table}</div>
                <div class="check-wrap">
                    <input type="checkbox" ${g.arrived ? 'checked' : ''} onchange="togglePresence('${g.id}','${g.table}')">
                </div>
            `;
            list.appendChild(el);
        });
    }

    function filterGuests() { renderGuestsList(); }

    function setFilter(f, el) {
        currentFilter = f;
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        renderGuestsList();
    }

    async function togglePresence(guestId, tableNum) {
        const g = guestData.tables[tableNum].guests.find(x => x.id === guestId);
        if (!g) return;

        try {
            const { error } = await window.supabase
                .from('invites')
                .update({ est_present: !g.arrived })
                .eq('id', guestId);

            if (error) {
                alert('Erreur de synchronisation !');
                console.error('Supabase toggle error', error);
                return;
            }

            g.arrived = !g.arrived;
            g.timestamp = g.arrived ? new Date().toISOString() : null;
            saveData();
            renderGuestsList();
            updateStats();
            showToast(`${g.name} — ${g.arrived ? 'Arrivé(e)' : 'En attente'}`);
        } catch (err) {
            alert('Erreur: ' + err.message);
            console.error('togglePresence error:', err);
        }
    }

    function selectGuest(guestId, tableNum) {
        const g = guestData.tables[tableNum].guests.find(x => x.id === guestId);
        if (!g) return;
        selectedGuest = g;

        document.getElementById('qrPlaceholder').style.display = 'none';
        const qrDiv = document.getElementById('qrcode');
        qrDiv.style.display = 'inline-block';
        qrDiv.innerHTML = '';
        new QRCode(qrDiv, {
            text: `${g.name}|Table ${tableNum}`,
            width: 140, height: 140,
            colorDark: '#111827', colorLight: '#ffffff'
        });
        const nameEl = document.getElementById('qrGuestName');
        const tableEl = document.getElementById('qrTableName');
        nameEl.textContent = g.name;
        tableEl.textContent = guestData.tables[tableNum].label;
        nameEl.style.display = 'block';
        tableEl.style.display = 'block';
    }

    // ── Stats ─────────────────────────────────────────────
    function updateStats() {
        let total = 0, arrived = 0;
        Object.keys(guestData.tables).forEach(t => {
            guestData.tables[t].guests.forEach(g => { total++; if (g.arrived) arrived++; });
        });
        document.getElementById('totalGuests').textContent   = total;
        document.getElementById('arrivedGuests').textContent = arrived;
        document.getElementById('pendingGuests').textContent = total - arrived;
    }

    // ── Table view ────────────────────────────────────────
    function renderTableView() {
        const grid = document.getElementById('tableViewGrid');
        grid.innerHTML = '';
        Object.keys(guestData.tables).sort().forEach(t => {
            const table = guestData.tables[t];
            const arrived = table.guests.filter(g => g.arrived).length;
            const total   = table.guests.length;
            const pct     = total ? Math.round(arrived / total * 100) : 0;

            const card = document.createElement('div');
            card.className = 'table-card';
            card.innerHTML = `
                <div class="table-card-header">
                    <h5>${escHtml(table.label)}</h5>
                    <span class="table-card-count">${arrived}/${total}</span>
                </div>
                <div class="table-card-body">
                    <div class="table-card-progress">
                        <div class="table-card-progress-fill" style="width:${pct}%"></div>
                    </div>
                    ${table.guests.map(g => `
                        <div class="guest-row-small ${g.arrived ? 'is-arrived' : ''}">
                            <span class="dot"></span>
                            ${escHtml(g.name)}
                        </div>
                    `).join('')}
                </div>
            `;
            grid.appendChild(card);
        });
    }

    // ── Reports ───────────────────────────────────────────
    function renderReports() {
        const wrap = document.getElementById('reportsContent');
        let totalGuests = 0, totalArrived = 0;
        const rows = [];

        Object.keys(guestData.tables).sort().forEach(t => {
            const table   = guestData.tables[t];
            const arrived = table.guests.filter(g => g.arrived).length;
            const total   = table.guests.length;
            totalGuests  += total;
            totalArrived += arrived;
            rows.push({ label: table.label, arrived, total, pct: total ? Math.round(arrived/total*100) : 0 });
        });

        const globalPct = totalGuests ? Math.round(totalArrived / totalGuests * 100) : 0;

        wrap.innerHTML = `
            <div class="reports-summary">
                <div class="report-kpi"><div class="kpi-val">${totalGuests}</div><div class="kpi-label">Invités total</div></div>
                <div class="report-kpi"><div class="kpi-val">${totalArrived}</div><div class="kpi-label">Présents</div></div>
                <div class="report-kpi"><div class="kpi-val">${globalPct}%</div><div class="kpi-label">Taux de présence</div></div>
            </div>
            <table class="reports-table">
                <thead><tr><th>Table</th><th>Présents</th><th>Total</th><th>Progression</th></tr></thead>
                <tbody>
                ${rows.map(r => `<tr>
                    <td>${escHtml(r.label)}</td>
                    <td>${r.arrived}</td>
                    <td>${r.total}</td>
                    <td>
                        <div style="display:flex;align-items:center;gap:8px">
                            <div class="progress-bar"><div class="progress-bar-fill" style="width:${r.pct}%"></div></div>
                            <span style="font-size:.78em;color:var(--ink-muted)">${r.pct}%</span>
                        </div>
                    </td>
                </tr>`).join('')}
                </tbody>
            </table>
        `;
    }

    // ── Modal ─────────────────────────────────────────────
    function openAddGuestModal() {
        document.getElementById('addGuestModal').classList.add('open');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('open');
    }

    async function addGuest() {
        const name  = document.getElementById('guestName').value.trim();
        const table = document.getElementById('guestTable').value;
        if (!name || !table) { showToast('Veuillez remplir tous les champs obligatoires.'); return; }

        const newGuest = {
            id: Math.random().toString(36).substr(2,9),
            name, arrived: false, timestamp: null
        };

        // Ajouter localement d'abord (feedback immédiat)
        guestData.tables[table].guests.push(newGuest);
        saveData();

        // Insérer dans Supabase (async)
        try {
            const { error } = await window.supabase
                .from('invites')
                .insert([{ id: newGuest.id, nom: name, est_present: false, table: parseInt(table) }]);
            
            if (error) {
                console.error('Erreur insertion Supabase:', error);
                showToast('⚠️ Erreur lors de la sauvegarde en base');
            }
        } catch (err) {
            console.error('addGuest Supabase error:', err);
        }

        document.getElementById('guestName').value  = '';
        document.getElementById('guestTable').value = '';
        closeModal('addGuestModal');
        renderGuestsList();
        updateStats();
        renderTableView();
        renderReports();
        showToast(`${name} ajouté(e) à la ${guestData.tables[table].label}`);
    }

    // ── Persist ───────────────────────────────────────────
    function saveData() {
        localStorage.setItem('guestData', JSON.stringify(guestData));
        syncData();
    }

    function syncData() {
        const pill = document.getElementById('syncStatus');
        pill.classList.add('syncing');
        pill.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            Synchronisation...`;
        setTimeout(() => {
            pill.classList.remove('syncing');
            pill.innerHTML = `
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Synchronisé`;
        }, 1400);
    }

    // ── Toast ─────────────────────────────────────────────
    function showToast(msg) {
        const t = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3200);
    }

    // ── Export ────────────────────────────────────────────
    function downloadReport() {
        let txt = 'RAPPORT DE PRÉSENCE\n===================\n\n';
        let tot = 0, arr = 0;
        Object.keys(guestData.tables).sort().forEach(t => {
            const table  = guestData.tables[t];
            const arrived = table.guests.filter(g => g.arrived).length;
            tot += table.guests.length; arr += arrived;
            txt += `${table.label} — ${arrived}/${table.guests.length} présents\n`;
            table.guests.forEach(g => { txt += `  ${g.name} — ${g.arrived ? 'Présent(e)' : 'En attente'}\n`; });
            txt += '\n';
        });
        txt += `TOTAL : ${arr}/${tot} (${tot ? Math.round(arr/tot*100) : 0}%)\n`;
        txt += `Date  : ${new Date().toLocaleString('fr-FR')}\n`;
        dlBlob(txt, 'text/plain', `rapport_${Date.now()}.txt`);
    }

    function exportCSV() {
        let csv = 'Nom,Table,Arrivé,Heure\n';
        Object.keys(guestData.tables).sort().forEach(t => {
            guestData.tables[t].guests.forEach(g => {
                csv += `"${g.name}","Table ${t}","${g.arrived ? 'Oui' : 'Non'}","${g.timestamp ? new Date(g.timestamp).toLocaleTimeString('fr-FR') : ''}"\n`;
            });
        });
        dlBlob(csv, 'text/csv', `invites_${Date.now()}.csv`);
    }

    function dlBlob(content, type, name) {
        const a = Object.assign(document.createElement('a'), {
            href: URL.createObjectURL(new Blob([content], { type })),
            download: name
        });
        a.click();
    }

    function printTableCards() { window.print(); }

    // ── Utils ─────────────────────────────────────────────
    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Close modal on overlay click
    document.getElementById('addGuestModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal('addGuestModal');
    });
</script>
</body>
</html>
